name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to create a Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          MANIFEST=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG  package.json=$PKG  manifest.json=$MANIFEST"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Version mismatch. Tag ($TAG), package.json ($PKG), and manifest.json ($MANIFEST) must all agree."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Package dist as zip
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="iris-v${VERSION}.zip"
          cd dist
          zip -r "../${ZIP}" . -x "*.DS_Store"
          cd ..
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          ls -lh "${ZIP}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          # Let gh auto-generate release notes from commits since the previous tag.
          gh release create "${GITHUB_REF_NAME}" "${ZIP}" \
            --title "Iris v${VERSION}" \
            --generate-notes
